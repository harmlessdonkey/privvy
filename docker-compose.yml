services:
  privvy:
    build:
      context: .
      args:
        WEC_REF: ${WEC_REF:-v4.5.0}
    image: privvy:local
    restart: unless-stopped
    # Published on the host's loopback only. Reach it from other machines through a private tunnel
    # (e.g. Tailscale) or a reverse proxy with HTTPS, not by opening the port to the network.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      PRIVVY_ADMIN_USERNAME: ${PRIVVY_ADMIN_USERNAME:-admin}
      PRIVVY_ADMIN_PASSWORD: ${PRIVVY_ADMIN_PASSWORD:-}
      PRIVVY_SESSION_SECRET: ${PRIVVY_SESSION_SECRET:-}
      PRIVVY_COOKIE_SECURE: ${PRIVVY_COOKIE_SECURE:-false}
    volumes:
      # Evidence, config, users and session key all live here. Back it up. Never commit it.
      - ./data:/data
    # Chromium needs more shared memory than Docker's 64MB default.
    shm_size: 1gb
    # Match the owner of ./data on the host (on Unraid shares this is often 99:100).
    user: "${PRIVVY_UID:-1000}:${PRIVVY_GID:-1000}"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
